version: 2
updates:
  # package.json and the lockfile (the only manifest in the repo).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine bumps; majors still come on their own.
      minor-and-patch:
        update-types: [minor, patch]
  # The pinned action versions in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
