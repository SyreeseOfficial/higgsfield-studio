name: CI
on:
  push:
    branches: [main]
  pull_request:
# Nothing here needs to write to the repository.
permissions:
  contents: read
# A newer push replaces a run still going on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm dlx knip@6.42.1 --include files,dependencies,unlisted
      - run: pnpm build
        env:
          HF_API_BASE_URL: https://example.invalid
